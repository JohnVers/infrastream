services:
  infrastream_gateway:
    build:
      context: ..
      dockerfile: deploy/gateway.Dockerfile
    container_name: infrastream_gateway
    ports:
      - "5005:5005"   # Http1 (ConnectionHandler or Kestrel)
      - "5006:5006"   # Http2
      - "5007:5007"   # Grpc
      - "5002:5002"   # Management (health, ready, metrics)
    deploy:
      resources:
        limits:
          cpus: "${GATEWAY_CPU:-4.0}"
          memory: "${GATEWAY_MEMORY:-2G}"
    environment:
      # ---- InfraStream configuration (ASP.NET Core convention: Section__Property) ----
      - InfraStream__IngressPort=${INGRESS_PORT:-5005}
      - InfraStream__ManagementPort=${MANAGEMENT_PORT:-5002}
      - InfraStream__WorkerCount=${WORKER_COUNT:-4}
      - InfraStream__QueueCapacity=${QUEUE_CAPACITY:-64}
      - InfraStream__Ingress__MaxBodySize=${MAX_BODY_SIZE:-1048576}

      # ---- Ingress protocols ----
      - InfraStream__Protocols__Http1__Enabled=${HTTP1_ENABLED:-true}
      - InfraStream__Protocols__Http1__Mode=${HTTP1_MODE:-ConnectionHandler}
      - InfraStream__Protocols__Http1__Port=${HTTP1_PORT:-0}
      - InfraStream__Protocols__Http2__MaxStreamsPerConnection=${HTTP2_MAX_STREAMS:-100}
      - InfraStream__Protocols__Http2__Enabled=${HTTP2_ENABLED:-false}
      - InfraStream__Protocols__Http2__Port=${HTTP2_PORT:-5006}
      - InfraStream__Protocols__Grpc__Enabled=${GRPC_ENABLED:-false}
      - InfraStream__Protocols__Grpc__Port=${GRPC_PORT:-5007}
      - InfraStream__Protocols__Grpc__MaxStreamsPerConnection=${GRPC_MAX_STREAMS:-100}
      - InfraStream__Protocols__Grpc__MaxReceiveMessageSize=${GRPC_MAX_MESSAGE_SIZE:-4194304}

      # ---- Logging ----
      # Silence InfraStream logs entirely: INFA_LOG_LEVEL=None docker compose up
      - Logging__LogLevel__InfraStream=${INFA_LOG_LEVEL:-Information}

      # ---- .NET runtime tuning ----
      - DOTNET_gcServer=1
      - DOTNET_GCLatencyMode=3
      - DOTNET_PROCESSOR_COUNT=${GATEWAY_CPU_INT:-4}
      - DOTNET_GCHeapHardLimit=${GC_HEAP_HARD_LIMIT:-0x60000000}

      # ---- ASP.NET Core ----
      - ASPNETCORE_ENVIRONMENT=Production
    healthcheck:
      test: [ "CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/5002' || exit 1" ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s
    restart: unless-stopped
    networks:
      - infrastream_net

  loadtests:
    build:
      context: ..
      dockerfile: tests/LoadTests/Dockerfile
    container_name: infrastream_loadtests
    depends_on:
      infrastream_gateway:
        condition: service_healthy
    environment:
      - LOAD_URL=${LOAD_URL:-http://infrastream_gateway:5005/api/v1/ingest}
      - LOAD_HTTP2=${LOAD_HTTP2:-false}
      - LOAD_PROTOCOL=${LOAD_PROTOCOL:-http}
      - LOAD_BATCH_SIZE=${LOAD_BATCH_SIZE:-10000}
      - LOAD_POOL_SIZE=${LOAD_POOL_SIZE:-32}
      - LOAD_COPIES=${LOAD_COPIES:-60}
      - LOAD_DURATION=${LOAD_DURATION:-60}
      # Comma-separated list of encodings to run sequentially.
      # Supported values: identity (or raw/none), br (or brotli), gzip (or gz).
      - LOAD_ENCODINGS=${LOAD_ENCODINGS:-identity,br,gzip}
    volumes:
      - ../tests/LoadTests/reports:/app/reports
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 2G
    networks:
      - infrastream_net

networks:
  infrastream_net:
    driver: bridge
