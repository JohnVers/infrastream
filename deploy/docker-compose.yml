services:
  infrastream_gateway:
    build:
      context: ..
      dockerfile: deploy/gateway.Dockerfile
    container_name: infrastream_gateway
    ports:
      - "5005:5005"
      - "5002:5002"
    deploy:
      resources:
        limits:
          cpus: "${GATEWAY_CPU:-4.0}"
          memory: "${GATEWAY_MEMORY:-2G}"
    environment:
      # ---- InfraStream configuration (ASP.NET Core convention: Section__Property) ----
      - InfraStream__IngressPort=${INGRESS_PORT:-5005}
      - InfraStream__ManagementPort=${MANAGEMENT_PORT:-5002}
      - InfraStream__WorkerCount=${WORKER_COUNT:-4}
      - InfraStream__QueueCapacity=${QUEUE_CAPACITY:-64}
      - InfraStream__Ingress__MaxBodySize=${MAX_BODY_SIZE:-1048576}

      # ---- .NET runtime tuning ----
      - DOTNET_gcServer=1
      - DOTNET_GCLatencyMode=3
      - DOTNET_PROCESSOR_COUNT=${GATEWAY_CPU_INT:-4}
      - DOTNET_GCHeapHardLimit=${GC_HEAP_HARD_LIMIT:-0x60000000}

      # ---- ASP.NET Core ----
      - ASPNETCORE_ENVIRONMENT=Production
    healthcheck:
      test: [ "CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/5002' || exit 1" ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s
    restart: unless-stopped
    networks:
      - infrastream_net

  loadtests:
    build:
      context: ..
      dockerfile: tests/LoadTests/Dockerfile
    container_name: infrastream_loadtests
    depends_on:
      infrastream_gateway:
        condition: service_healthy
    environment:
      - LOAD_URL=http://infrastream_gateway:5005/api/v1/ingest
      - LOAD_BATCH_SIZE=${LOAD_BATCH_SIZE:-10000}
      - LOAD_POOL_SIZE=${LOAD_POOL_SIZE:-32}
      - LOAD_COPIES=${LOAD_COPIES:-60}
      - LOAD_DURATION=${LOAD_DURATION:-60}
      # Comma-separated list of encodings to run sequentially.
      # Supported values: identity (or raw/none), br (or brotli), gzip (or gz).
      - LOAD_ENCODINGS=${LOAD_ENCODINGS:-identity,br,gzip}
    volumes:
      - ../tests/LoadTests/reports:/app/reports
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 2G
    networks:
      - infrastream_net

networks:
  infrastream_net:
    driver: bridge
