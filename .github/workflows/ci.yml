# Build and test workflow.
#
# Runs on every push to `main` and on every pull request targeting `main`.
#
# Uses a dedicated CI solution (InfraStream.CI.slnx) that contains only the
# core projects and unit tests. BenchmarkDotNet and NBomber projects are
# excluded from CI — they require dedicated hardware and are executed
# manually (see deploy/run_bench.sh and docs/benchmarks.md).

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: Restore
        run: dotnet restore InfraStream.CI.slnx

      - name: Build (Release)
        run: dotnet build InfraStream.CI.slnx --no-restore --configuration Release

      - name: Test (Release)
        run: |
          dotnet test InfraStream.CI.slnx \
            --no-build \
            --configuration Release \
            --logger "trx;LogFileName=results.trx" \
            --results-directory ./TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ./TestResults
          if-no-files-found: ignore
          retention-days: 7
