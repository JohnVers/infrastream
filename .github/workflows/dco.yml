# Verifies that every commit in a pull request is signed off under the
# Developer Certificate of Origin (DCO).
#
# See CONTRIBUTING.md for how to sign off commits (`git commit -s`).
#
# Runs on every PR targeting `main`. Unsigned commits will cause the check
# to fail and the PR will not be merged.

name: DCO

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  dco:
    name: Developer Certificate of Origin
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history is required so the action can inspect every commit
          # in the pull request, not just the latest one.
          fetch-depth: 0

      - name: Check commits for Signed-off-by
        uses: tim-actions/dco@master
        with:
          commits: ${{ github.event.pull_request.commits_url }}
